name: Release Theme

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update version in style.css
        run: |
          sed -i "s/^Version: .*/Version: ${{ steps.version.outputs.VERSION }}/" style.css

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare release package
        run: |
          mkdir -p release/korn-und-hansemarkt-theme
          cp functions.php index.php style.css theme.json LICENSE release/korn-und-hansemarkt-theme/
          cp screenshot.png release/korn-und-hansemarkt-theme/ 2>/dev/null || true
          cp -r inc release/korn-und-hansemarkt-theme/
          cp -r dist release/korn-und-hansemarkt-theme/
          cp -r blocks release/korn-und-hansemarkt-theme/
          # assets/ enthält Admin- und Editor-Skripte, die zur Laufzeit per URL
          # geladen werden (Block-Visibility, Programm-Schnellbearbeitung) und
          # deshalb nicht im dist-Bundle stecken.
          cp -r assets release/korn-und-hansemarkt-theme/
          # Default-POIs des Geländeplans: Fallback, wenn in der Datenbank kein
          # eigenes GeoJSON gespeichert ist. Nur diese Datei, nicht ganz src/ –
          # die Fonts liegen bereits gebündelt in dist/.
          mkdir -p release/korn-und-hansemarkt-theme/src/assets/map
          cp src/assets/map/event-map-pois.json release/korn-und-hansemarkt-theme/src/assets/map/
          cd release && zip -r ../korn-und-hansemarkt-theme-${{ steps.version.outputs.VERSION }}.zip korn-und-hansemarkt-theme/

      - name: Deploy to server
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_PASSWORD }}" rsync -avz --delete \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no" \
            release/korn-und-hansemarkt-theme/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: korn-und-hansemarkt-theme-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
